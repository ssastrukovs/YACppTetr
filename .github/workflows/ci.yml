name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build libsdl3-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: ./configure.sh

      - name: Build and test
        run: ./build_n_test.sh
